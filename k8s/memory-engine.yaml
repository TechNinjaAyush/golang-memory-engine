apiVersion: v1
kind: ConfigMap
metadata:
  name: memory-engine-config
  namespace: default
  labels:
    app.kubernetes.io/name: memory-engine
    app.kubernetes.io/component: worker
data:
  NATS_URL: nats://nats:4222
  NEO4J_URI: bolt://neo4j:7687
---
apiVersion: v1
kind: Secret
metadata:
  name: memory-engine-secret
  namespace: default
  labels:
    app.kubernetes.io/name: memory-engine
    app.kubernetes.io/component: worker
type: Opaque
stringData:
  NEO4J_USERNAME: neo4j
  NEO4J_PASSWORD:  your_password
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: default
  labels:
    app.kubernetes.io/name: neo4j
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: neo4j
  ports:
    - name: bolt
      port: 7687
      targetPort: bolt
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-engine
  namespace: default
  labels:
    app.kubernetes.io/name: memory-engine
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: memory-engine
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memory-engine
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: memory-engine
          image:     asia-south1-docker.pkg.dev/project-e8e2dbb5-cb6b-4e9e-a0b/sre-images/memory-engine:70f224b3db4fc566a8efa3b3cff55e18e0bc94b8




          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: memory-engine-config
            - secretRef:
                name: memory-engine-secret
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          
      restartPolicy: Always